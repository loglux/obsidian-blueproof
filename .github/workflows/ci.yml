name: Build and lint

# The public repository's check, on GitHub's own runners: a pull request from anyone runs here, never on a computer of
# the author's. Tests are not part of the public repository (they stay with the development).
on:
    push:
        branches: [main]
    pull_request:
        branches: ['**']

permissions:
    contents: read

jobs:
    build:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                node-version: [20.x, 22.x, 24.x]
        steps:
            - uses: actions/checkout@v6
            - name: Use Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v6
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: 'npm'
            - run: npm ci
            - run: npm run build
            - run: npm run lint
